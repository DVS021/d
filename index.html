<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Стандарты продаж СМБ «1С-Рарус»</title>
  <link rel="stylesheet" href="assets/styles.css?v=15fd93738d8d" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand brand-logo" data-nav="home" aria-label="1С-Рарус — на главную">
        <img class="rarus-logo" src="assets/rarus-logo.png" alt="1С-Рарус" width="204" height="68" />
        <span class="brand-caption">Стандарты продаж СМБ</span>
      </button>
      <div class="side-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav class="side-nav" aria-label="Основное меню">
        <button class="side-link active" data-nav="home"><span class="ico" data-icon="house"></span><span>Главная</span></button>
        <button class="side-link" data-nav="catalog"><span class="ico" data-icon="book"></span><span>Стандарты</span><span class="side-count" id="standards-count">19</span></button>
        <button class="side-link" data-nav="practice"><span class="ico" data-icon="puzzle"></span><span>Практика</span></button>
        <button class="side-link" data-nav="reference"><span class="ico" data-icon="layers"></span><span>Справочник</span></button>
      </nav>
      <div class="side-label side-label-secondary" id="management-label">ДЛЯ РУКОВОДИТЕЛЕЙ</div>
      <nav class="side-nav" id="management-nav"><button class="side-link" data-nav="control"><span class="ico" data-icon="shield"></span><span>Руководителю</span></button></nav>
      <div class="sidebar-spacer"></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button mobile-menu" aria-label="Открыть меню"><span class="ico" data-icon="menu"></span></button>
        <div class="breadcrumbs"><span>Портал стандартов</span><span class="crumb-sep">/</span><strong id="breadcrumb">Главная</strong></div>
        <button class="top-search" data-nav="search" aria-label="Найти стандарт, термин или ситуацию"><span class="ico" data-icon="search"></span><span>Найти стандарт, термин, ситуацию...</span><kbd>Ctrl K</kbd></button>
        <div class="topbar-right">
          <button class="top-learning" data-nav="study"><span class="ico" data-icon="graduation"></span><span>Моё обучение</span><span class="top-learning-count" id="learning-progress" aria-label="Пройдено тем: 0 из 4">0/4</span></button>
          <span class="top-divider"></span>
          <div class="role-picker"><label for="role-select">Роль</label><select id="role-select" title="Рабочие задачи, приоритетные материалы и кейсы"><option value="general">Общее</option><option value="employee">Сотрудник ОП</option><option value="dispatcher">Диспетчер</option><option value="manager">РОП</option><option value="controller">Контролёр</option></select></div>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
      <footer class="app-footer"><span>Стандарты продаж СМБ · 1С-Рарус</span><a href="#sources" data-nav="sources">Документы</a><button type="button" class="link-button" data-feedback="question">Задать вопрос или сообщить о неточности</button></footer>
    </div>
    <div id="overlay-root"></div>
  </div>
