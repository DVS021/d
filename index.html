<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand brand-logo" data-nav="home" aria-label="1С-Рарус — на главную">
        <img class="rarus-logo" src="assets/rarus-logo.png" alt="1С-Рарус" width="204" height="68" />
        <span class="brand-caption">Стандарты продаж СМБ</span>
      </button>
      <div class="side-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav class="side-nav" aria-label="Основное меню">
        <button class="side-link active" data-nav="home"><span class="ico" data-icon="house"></span><span>Главная</span></button>
        <button class="side-link" data-nav="catalog"><span class="ico" data-icon="book"></span><span>Стандарты</span><span class="side-count" id="standards-count">18</span></button>
        <button class="side-link" data-nav="visuals"><span class="ico" data-icon="route"></span><span>Схемы</span></button>
        <button class="side-link" data-nav="practice"><span class="ico" data-icon="puzzle"></span><span>Практика</span></button>
        <button class="side-link" data-nav="trainer"><span class="ico" data-icon="users"></span><span>Тренер</span></button>
        <button class="side-link" data-nav="quiz"><span class="ico" data-icon="graduation"></span><span>Проверь себя</span></button>
        <button class="side-link" data-nav="glossary"><span class="ico" data-icon="layers"></span><span>Глоссарий</span></button>
      </nav>
      <div class="side-label side-label-secondary">ДЛЯ РУКОВОДИТЕЛЕЙ</div>
      <nav class="side-nav"><button class="side-link" data-nav="control"><span class="ico" data-icon="shield"></span><span>Руководителю</span></button></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-bottom">
        <div class="progress-heading"><span>Личный прогресс</span><strong id="side-progress">0/3</strong></div>
        <div class="progress-track"><div id="side-progress-bar"></div></div>
        <p>Ваши отметки сохраняются в этом браузере.</p>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button mobile-menu" aria-label="Открыть меню"><span class="ico" data-icon="menu"></span></button>
        <div class="breadcrumbs"><span>Портал стандартов</span><span class="crumb-sep">/</span><strong id="breadcrumb">Главная</strong></div>
        <div class="topbar-right">
          <button class="top-search" data-nav="search"><span class="ico" data-icon="search"></span><span>Найти стандарт, термин, ситуацию...</span><kbd>Ctrl K</kbd></button>
          <span class="top-divider"></span>
          <div class="role-picker"><label for="role-select">Роль</label><select id="role-select" title="Рабочие задачи, приоритетные материалы и кейсы"><option value="general">Общее</option><option value="employee">Сотрудник ОП</option><option value="dispatcher">Диспетчер</option><option value="manager">РОП</option><option value="controller">Контролёр</option></select></div>
          <div class="avatar" title="1С-Рарус">1С</div>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
      <footer class="app-footer">Стандарты продаж СМБ · 1С-Рарус <a href="#sources" data-nav="sources">Документы</a></footer>
    </div>
    <div id="overlay-root"></div>
